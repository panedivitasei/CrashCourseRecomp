# Crash Course (1) recompilation manifest (ReXGlue codegen input, upstream SDK).

[project]
name = "cc1"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/cc1"
# The scan runs on the image patched with TU1 (assets/default.xexp), the loose
# sibling patch, so every guest address here and in src/ is a TU1 address.

# CRT setjmp and longjmp, identified by the `lwz r0/cmpwi/mtctr r0/bnectr`
# hook-thunk prologue and the f14-f31 jmp_buf restore loop.
setjmp_address = 0x824E4B20
longjmp_address = 0x824E4DF0
# Registers stay in ctx, so a mid-function hook can read the live context through
# current_ppc_context() (src/guest_hooks.cpp).
non_volatile_as_local = false
includes = [
"config/cc1_funcs.toml",
"config/cc1_hooks.toml",
]
